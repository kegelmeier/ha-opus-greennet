# Integration quality scale self-assessment for a CUSTOM integration.
#
# This file follows the official rule keys and schema of Home Assistant's
# hassfest (script/hassfest/quality_scale.py). Hassfest validates this file
# only for core integrations, so tests/test_quality_scale.py applies the same
# schema and the applicable official validators in this repository's CI.
#
# It is not an official rating. Home Assistant assigns quality scale tiers only
# to core integrations; manifest.json intentionally declares no quality_scale.
# Evidence for every rule: docs/quality/quality-scale-evidence.md
rules:
  # Bronze
  action-setup:
    status: done
    comment: Actions are registered in async_setup and validate entry and device in the handler.
  appropriate-polling:
    status: exempt
    comment: >-
      Push integration (iot_class local_push); no entity polls (should_poll is
      False). State arrives on the gateway's REST event stream. The 60 s health
      probe and the 30 min device list refresh are documented under
      docs-data-update.
  brands:
    status: done
    comment: Local brand/ folder (icon, logo, @2x), supported for custom integrations since HA 2026.3.
  common-modules:
    status: done
    comment: Runtime coordinator in coordinator.py, shared base entity in entity.py.
  config-flow:
    status: done
    comment: UI config flow with data_description for every field.
  config-flow-test-coverage:
    status: done
    comment: 100 % gate in CI; every error is followed by a recovering submission.
  dependency-transparency:
    status: done
    comment: The integration has no Python requirements (manifest requirements is empty).
  docs-actions:
    status: done
    comment: docs/devices.md section Actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: README introduction and Features.
  docs-installation-instructions:
    status: done
    comment: README Compatibility and Installation; docs/upgrading.md.
  docs-removal-instructions:
    status: done
    comment: README section Removing the integration.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: Dispatcher subscriptions are created in async_added_to_hass and released with async_on_remove.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The config flow reads the gateway's system information (and its EURID) before creating the entry.
  test-before-setup:
    status: done
    comment: >-
      async_setup_entry raises ConfigEntryNotReady when the gateway does not
      answer and ConfigEntryAuthFailed when it rejects the credentials.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README section Configuration describes the one option, write access to device settings.
  docs-installation-parameters:
    status: done
    comment: README section Configuration describes host, port, username and password.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Every platform sets PARALLEL_UPDATES = 0; requests are serialised by the transport queue.
  reauthentication-flow:
    status: done
    comment: >-
      Rejected credentials, a different gateway at the configured address and
      entries of the former MQTT transport start the reauth flow.
  test-coverage:
    status: done
    comment: CI enforces more than 95 % per integration module and in total (script/check_coverage.py).

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: >-
      Zeroconf: the gateway announces _enocean._tcp (instance opusshgw). The
      discovery step identifies configured gateways by their EURID; a new
      gateway is offered with its address filled in (credentials are not
      announced). Entries of the former MQTT setup search the network at setup.
  discovery-update-info:
    status: done
    comment: >-
      A configured gateway announced at another address is updated and
      reloaded once its REST API reports the entry's EURID.
  docs-data-update:
    status: done
    comment: docs/how-it-works.md section Updates and availability.
  docs-examples:
    status: done
    comment: docs/examples.md section Examples (rocker automation, blind actions, window handle, leak alert, action response).
  docs-known-limitations:
    status: done
    comment: README and docs/how-it-works.md section Known limitations.
  docs-supported-devices:
    status: done
    comment: README section Supported devices; docs/devices.md.
  docs-supported-functions:
    status: done
    comment: README sections Features and Supported devices; docs/devices.md.
  docs-troubleshooting:
    status: done
    comment: README section Troubleshooting; docs/troubleshooting.md.
  docs-use-cases:
    status: done
    comment: docs/examples.md section Use cases.
  dynamic-devices:
    status: done
    comment: Devices discovered after setup are added through dispatcher signals.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      The per-device signal strength sensor and the D2-06-40 handle unlock
      request and mechanics fault diagnostics are disabled for new registry
      entries; existing user enablement is preserved.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: >-
      icons.json with state icons for the handle position, handle closed,
      unlock request and mechanics fault entities plus service icons; all other
      entities keep their device-class icons. No Python icon properties.
  reconfiguration-flow:
    status: done
    comment: >-
      The reconfigure flow changes host, port and credentials and rejects an
      address that answers as a different gateway.
  repair-issues:
    status: done
    comment: >-
      Persistent, fixable repair after the one-time removal of a duplicate beta
      entity during unique-ID migration, and a non-fixable notice while an
      entry's gateway address is outside the local network (cleared by the next
      load with a local address). Transient gateway or radio outages and quiet
      sensors are intentionally not issues.
  stale-devices:
    status: done
    comment: >-
      async_remove_config_entry_device allows manual removal. Devices are never
      removed automatically because the gateway cannot confirm that a quiet
      EnOcean device is gone.

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      The integration has no Python requirements; it talks to the gateway with
      aiohttp, which Home Assistant ships, through its own small async client.
  inject-websession:
    status: done
    comment: >-
      The REST client receives Home Assistant's shared aiohttp session
      (async_get_clientsession) in both the config flow and the entry setup.
  strict-typing:
    status: done
    comment: >-
      mypy --strict for every module is a CI gate ([tool.mypy] in pyproject.toml).
      The core .strict-typing file does not apply to a custom integration.
