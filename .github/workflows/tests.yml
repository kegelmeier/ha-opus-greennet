name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.2", "2026.9.1"]
    name: Home Assistant ${{ matrix.homeassistant }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install -r requirements_test.txt
          "homeassistant==${{ matrix.homeassistant }}"

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate integration metadata
        uses: home-assistant/actions/hassfest@master
