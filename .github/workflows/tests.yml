name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed reference: change only in a reviewed phase, together with
  # requirements_test_reference.txt.
  REFERENCE_HA_VERSION: "2026.10.4"
  # home-assistant/core tag 2026.10.4; hassfest rules and validators are built
  # from this immutable commit instead of the moving hassfest image.
  REFERENCE_HA_CORE_SHA: "357cae5c598dfcd7a0ea7dc5b1facccd4ec6037b"

jobs:
  reference:
    runs-on: ubuntu-24.04
    name: Home Assistant 2026.10.4 (fixed reference)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_test_reference.txt

      - name: Install fixed reference dependencies
        run: python -m pip install -r requirements_test_reference.txt

      - name: Verify the installed reference release
        run: |
          python - <<'PY'
          import os
          from homeassistant.const import __version__

          expected = os.environ["REFERENCE_HA_VERSION"]
          if __version__ != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, got {__version__}")
          print(f"Home Assistant {__version__} (fixed reference)")
          PY

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Check strict typing
        run: python -m mypy

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing --cov-report=json:coverage.json

      - name: Check per-module coverage
        run: python script/check_coverage.py coverage.json

  test:
    runs-on: ubuntu-latest
    name: Home Assistant (latest stable)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Resolve latest stable Home Assistant
        id: homeassistant
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          with urllib.request.urlopen("https://pypi.org/pypi/homeassistant/json", timeout=30) as response:
              version = json.load(response)["info"]["version"]
          if not re.fullmatch(r"\d{4}\.\d+\.\d+", version):
              raise SystemExit(f"Expected a stable Home Assistant release, got {version!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"Testing Home Assistant **{version}** (latest stable).\n")
          print(f"Selected Home Assistant {version}")
          PY

      - name: Install dependencies
        run: >-
          python -m pip install --upgrade -r requirements_test.txt
          "homeassistant==${{ steps.homeassistant.outputs.version }}"

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Check strict typing
        # Configuration: [tool.mypy] in pyproject.toml (strict, all modules).
        run: python -m mypy

      - name: Run tests
        # Total gate: fail_under in [tool.coverage.report] of pyproject.toml.
        run: pytest -v --cov --cov-report=term-missing --cov-report=json:coverage.json

      - name: Check per-module coverage
        # Quality scale: above 95 % per module, 100 % for config_flow.py.
        run: python script/check_coverage.py coverage.json

      - name: Repeat lifecycle and race regression tests
        # Order- and timing-sensitive suites must pass repeatedly, not once.
        run: |
          for run in 1 2 3; do
            echo "Repetition $run"
            pytest -q -p no:cacheprovider \
              tests/test_release_transport_safety.py \
              tests/test_ha_lifecycle.py \
              tests/test_event_lifecycle.py \
              tests/test_background_efficiency.py \
              tests/test_device_removal.py \
              tests/test_binary_sensor_discovery.py \
              tests/test_coordinator_stream.py \
              tests/test_coordinator_requests.py \
              tests/test_coordinator_commands.py || exit 1
          done

  validate-reference:
    runs-on: ubuntu-24.04
    name: Hassfest at Home Assistant 2026.10.4 (fixed reference)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: integration
          persist-credentials: false

      - name: Check out Home Assistant core at the reference commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: ${{ env.REFERENCE_HA_CORE_SHA }}
          path: core
          persist-credentials: false
          sparse-checkout: |
            homeassistant
            pylint/plugins/pylint_home_assistant/generated
            script

      - name: Build hassfest from the reference commit
        working-directory: core
        run: |
          test "$(git rev-parse HEAD)" = "${REFERENCE_HA_CORE_SHA}"
          docker build --file script/hassfest/docker/Dockerfile \
            --tag hassfest-reference .

      - name: Validate integration metadata (fixed reference)
        working-directory: integration
        run: |
          docker run --rm -v "${PWD}:/github/workspace" hassfest-reference
          echo "Hassfest built from home-assistant/core \`${REFERENCE_HA_CORE_SHA}\`." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check icons against the reference MDI catalogue
        # The catalogue is generated by hassfest from the pinned frontend and is
        # not part of the homeassistant wheel.
        run: |
          set -o pipefail
          python3 integration/script/check_icons.py \
            core/pylint/plugins/pylint_home_assistant/generated/mdi_icons.py \
            integration/custom_components/opus_greennet/icons.json \
            | tee icon-check.txt
          {
            echo "### Icon catalogue check (home-assistant/core \`${REFERENCE_HA_CORE_SHA}\`)"
            echo
            echo '```'
            tail -n 1 icon-check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    # Moving hassfest image (latest master): additional compatibility signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate integration metadata
        uses: home-assistant/actions/hassfest@master

  hacs:
    # Required for the HACS default store: description, topics, brand icon,
    # hacs.json and README.
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
