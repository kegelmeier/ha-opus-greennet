blueprint:
  name: "Opus GreenNet: motion and presence light with optional night light"
  description: |-
    **What this does.** The light switches on when a motion or presence sensor reports someone. It switches off again after the last sensor has been quiet for the time you choose.

    **Set it up in three steps** (section 1 below). Nothing else is needed:
    1. Pick the sensors.
    2. Pick the lights.
    3. Choose how long the light stays on.

    **Create one automation per room.** One automation can use many sensors and many lights. Use the blueprint again for the next room.

    **How long does the light stay on?** The extra time starts when ALL chosen sensors are quiet. Many sensors have their own hold time. The real time is the hold time of the sensor plus the time you set here.

    **Optional parts** (sections 2 to 5, closed at the start): a fixed brightness, "only when it is dark", a night light with other lights or another brightness, and a lock. Leave them alone if you do not need them. Fields of an optional part only matter if you switch that part on.

    **Good to know**
    - The automation only switches off lights that it switched on itself. A light that was already on stays as it is.
    - If you switch a light off by hand while someone is in the room, it is not switched on again until the room has been empty for the extra time.
    - If Home Assistant restarts, or this automation is saved or reloaded, it forgets which lights it switched on. Those lights then stay on until you switch them off.
    - The sensors and the lights must already exist in Home Assistant. Sensors and lights of different makers can be mixed.
  domain: automation
  author: Opus GreenNet Bridge
  source_url: https://github.com/kegelmeier/ha-opus-greennet/blob/main/blueprints/automation/opus_greennet/motion_presence_light.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    basic_section:
      name: "1. Basic settings"
      icon: mdi:motion-sensor
      description: Fill in these three things. Then the light works.
      input:
        motion_sensors:
          name: Motion or presence sensors
          description: >-
            Which sensors should switch the light? You can pick several. The
            light stays on as long as at least one of them reports motion or
            presence.
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        lights:
          name: Lights
          description: >-
            The lights to switch on. Leave this empty if you only use light
            switches (next field). Fill in at least one of the two fields. The
            form cannot check this: without a light the automation writes an
            error to its trace.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        extra_switches:
          name: More light switches
          description: >-
            For lighting that Home Assistant shows as a switch. Only pick
            switches that really control a light.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
        off_delay:
          name: Stay on after the last movement
          description: >-
            How long the light stays on after all sensors are quiet. 0 means:
            switch off as soon as all sensors are quiet. Hours, minutes and
            seconds.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
    brightness_section:
      name: "2. Set the brightness (optional)"
      icon: mdi:brightness-6
      description: >-
        Only fill in if you want a fixed brightness. Without it the lights are
        only switched on.
      collapsed: true
      input:
        set_brightness:
          name: Set the brightness
          description: >-
            Off: the lights are only switched on, no brightness is set. On:
            dimmable lights get the brightness below. Lights that cannot be
            dimmed and switches are just switched on.
          default: false
          selector:
            boolean:
        brightness:
          name: Brightness in percent
          description: >-
            Only fill in if "Set the brightness" is switched on. This is the
            brightness of the lamp, not of the room.
          default: 80
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    darkness_section:
      name: "3. Only when it is dark (optional)"
      icon: mdi:weather-night
      description: >-
        Only fill in if the light should come on only in the dark. You need a
        sensor that measures the brightness of the room in lux.
      collapsed: true
      input:
        only_when_dark:
          name: Only switch on when it is dark
          description: >-
            Off: the light comes on whenever someone is there. On: the
            brightness check below also has to be met.
          default: false
          selector:
            boolean:
        lux_sensor:
          name: Brightness sensor
          description: >-
            Only fill in if "Only switch on when it is dark" is switched on.
            A sensor that measures the brightness of the room in lux, not the
            brightness of the lamp.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
        lux_threshold:
          name: Switch on below this brightness (lux)
          description: >-
            Below this value the light may be switched on automatically. Exactly
            this value is not below it: the light stays off. The check is made
            when the light would come on. A light that is already on is not
            switched off when the room gets brighter. A broken or missing
            reading counts as dark, so the light still works.
          default: 50
          selector:
            number:
              min: 1
              max: 10000
              step: 1
              unit_of_measurement: lx
              mode: box
    night_section:
      name: "4. Night light (optional)"
      icon: mdi:lightbulb-night
      description: >-
        Only fill in if the light should work differently at night. The night
        light is chosen when the light comes on and is kept until the room is
        empty again.
      collapsed: true
      input:
        night_mode:
          name: Night light
          description: >-
            No night light: nothing changes at night. Same lights: at night the
            lights above are used with the night brightness and night time
            below. Other lights: at night the night lights below are used. If
            you pick no night lights, the normal lights are used.
          default: none
          selector:
            select:
              mode: dropdown
              options:
                - label: No night light
                  value: none
                - label: Use the same lights at night
                  value: same
                - label: Use other lights at night
                  value: other
        night_start:
          name: Night starts at
          description: >-
            Only fill in if you use a night light. The night can reach past
            midnight. If start and end are the same, there is no night.
          default: "22:00:00"
          selector:
            time:
        night_end:
          name: Night ends at
          description: Only fill in if you use a night light.
          default: "06:00:00"
          selector:
            time:
        night_lights:
          name: Night lights
          description: >-
            Only fill in for "Use other lights at night". Leave empty to use the
            normal lights.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        night_switches:
          name: More night light switches
          description: >-
            Only fill in for "Use other lights at night". For lighting that Home
            Assistant shows as a switch.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
        night_set_brightness:
          name: Set a night brightness
          description: >-
            Off: the lights are only switched on at night, no brightness is set.
            On: dimmable lights get the night brightness.
          default: false
          selector:
            boolean:
        night_brightness:
          name: Night brightness in percent
          description: >-
            Only fill in if "Set a night brightness" is switched on.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        night_off_delay:
          name: Stay on at night after the last movement
          description: >-
            Only fill in if you use a night light. Used instead of the time in
            section 1 at night.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration:
    advanced_section:
      name: "5. Advanced settings (optional)"
      icon: mdi:cog
      description: Most people do not need these settings.
      collapsed: true
      input:
        lock_entity:
          name: Lock (optional)
          description: >-
            Pick a switch or sensor that works as a lock. While it is on, the
            automation switches no further lights on. Lights that it switched on
            before are switched off as usual. Leave empty if you do not need
            this. A lock that is off, unknown or unavailable does not lock.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
                    - switch
        night_source:
          name: Where does the night come from?
          description: >-
            Pick exactly one. Times: the times from section 4. Own switch: the
            night is on while the switch below is on. Only used if you chose a
            night light in section 4.
          default: time
          selector:
            select:
              mode: dropdown
              options:
                - label: Use the times from section 4
                  value: time
                - label: Use my own night mode switch
                  value: helper
        night_helper:
          name: Own night mode switch
          description: >-
            Only fill in for "Use my own night mode switch". On means night.
            If it is off, unknown, unavailable or missing, it is not night.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
                    - input_boolean
                    - switch

# One run per room is the memory of the automation. It knows which lights it
# switched on, so it can switch off only those. A second start while a run is
# active is ignored. A restart would delete that memory, so "single" is used.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    id: sensor_active
    entity_id: !input motion_sensors
    to: "on"
  - trigger: homeassistant
    id: ha_started
    event: start

variables:
  sensors: !input motion_sensors
  lights: !input lights
  switches: !input extra_switches
  delay_day: !input off_delay
  use_brightness: !input set_brightness
  brightness_day: !input brightness
  lux_enabled: !input only_when_dark
  lux_entity: !input lux_sensor
  lux_limit: !input lux_threshold
  night_mode: !input night_mode
  night_start: !input night_start
  night_end: !input night_end
  night_lights: !input night_lights
  night_switches: !input night_switches
  night_use_brightness: !input night_set_brightness
  night_brightness_value: !input night_brightness
  delay_night: !input night_off_delay
  lock_entity: !input lock_entity
  night_source: !input night_source
  night_helper: !input night_helper

actions:
  - alias: Stop with an error if the setup is incomplete
    if:
      - condition: template
        value_template: >-
          {{ (lights | count) + (switches | count) == 0
             or (lux_enabled and lux_entity == '') }}
    then:
      - stop: >-
          Setup incomplete: pick at least one light or light switch, and a
          brightness sensor if "Only switch on when it is dark" is on.
        error: true

  - alias: Do nothing if no sensor reports activity
    condition: template
    value_template: >-
      {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}

  - alias: Wait until the light may start, or until everyone has left
    wait_template: >-
      {% set active = expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 %}
      {% set locked = lock_entity != '' and is_state(lock_entity, 'on') %}
      {% set lux = states(lux_entity) if (lux_enabled and lux_entity != '') else '' %}
      {% set dark = (not lux_enabled) or (not is_number(lux)) or ((lux | float) < (lux_limit | float)) %}
      {{ (not active) or ((not locked) and dark) }}

  - alias: Stop if everyone left before the light was needed
    if:
      - condition: template
        value_template: >-
          {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
    then:
      - stop: Everyone left before the light was needed.

  - alias: Choose day or night once for this run
    variables:
      night_active: >-
        {% set now_hm = now().strftime('%H:%M') %}
        {% set s = night_start[:5] %}
        {% set e = night_end[:5] %}
        {% if night_mode == 'none' %}{% set r = false %}
        {% elif night_source == 'helper' %}{% set r = night_helper != '' and is_state(night_helper, 'on') %}
        {% elif s == e %}{% set r = false %}
        {% elif s < e %}{% set r = s <= now_hm < e %}
        {% else %}{% set r = now_hm >= s or now_hm < e %}
        {% endif %}
        {{ r }}
      use_night_targets: >-
        {{ night_active and night_mode == 'other'
           and ((night_lights | count) + (night_switches | count)) > 0 }}
      run_lights: "{{ night_lights if use_night_targets else lights }}"
      run_switches: "{{ night_switches if use_night_targets else switches }}"
      run_set_brightness: "{{ night_use_brightness if night_active else use_brightness }}"
      run_brightness: "{{ night_brightness_value if night_active else brightness_day }}"
      run_delay: >-
        {{ timedelta(**(delay_night if night_active else delay_day)).total_seconds() }}
      owned_lights: >-
        {{ run_lights | reject('is_state', 'on') | reject('is_state', 'unavailable') | list }}
      owned_switches: >-
        {{ run_switches | reject('is_state', 'on') | reject('is_state', 'unavailable') | list }}
      dimmable_lights: >-
        {% set ns = namespace(found=[]) %}
        {% for entity in owned_lights %}
          {% set modes = state_attr(entity, 'supported_color_modes') or [] %}
          {% if (modes | reject('in', ['onoff', 'unknown']) | list | count) > 0 %}
            {% set ns.found = ns.found + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      dim_lights: "{{ dimmable_lights if run_set_brightness else [] }}"
      plain_lights: "{{ owned_lights | reject('in', dim_lights) | list }}"

  - alias: Switch on dimmable lights with the chosen brightness
    if:
      - condition: template
        value_template: "{{ dim_lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ dim_lights }}"
        data:
          brightness_pct: "{{ run_brightness | int }}"
        continue_on_error: true

  - alias: Switch on the other lights
    if:
      - condition: template
        value_template: "{{ plain_lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ plain_lights }}"
        continue_on_error: true

  - alias: Switch on the light switches
    if:
      - condition: template
        value_template: "{{ owned_switches | count > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ owned_switches }}"
        continue_on_error: true

  # The run stays alive until the room is empty and the extra time is over.
  # That is what keeps a light that was switched off by hand from being
  # switched on again during the same visit. Every round waits for an event.
  # "count" is used because Home Assistant stops "while" loops after 10000
  # rounds; the end of the run is the "stop" action below, not the count.
  - alias: Keep the light on until everyone has gone and the extra time is over
    repeat:
      count: 1000000
      sequence:
        - alias: Wait until all sensors are quiet
          wait_template: >-
            {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
        - alias: Extra time (new activity cancels it)
          wait_for_trigger:
            - trigger: state
              entity_id: !input motion_sensors
              to: "on"
          timeout: "{{ [run_delay | float, 0.1] | max }}"
          continue_on_timeout: true
        - alias: Time is up and all sensors are still quiet, switch off
          if:
            - condition: template
              value_template: >-
                {{ wait.trigger is none
                   and expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          then:
            - variables:
                off_lights: >-
                  {{ owned_lights | select('is_state', ['on', 'unknown']) | list }}
                off_switches: >-
                  {{ owned_switches | select('is_state', ['on', 'unknown']) | list }}
            - if:
                - condition: template
                  value_template: "{{ off_lights | count > 0 }}"
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ off_lights }}"
                  continue_on_error: true
            - if:
                - condition: template
                  value_template: "{{ off_switches | count > 0 }}"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: "{{ off_switches }}"
                  continue_on_error: true
            - stop: Room empty, the lights of this run are switched off.
