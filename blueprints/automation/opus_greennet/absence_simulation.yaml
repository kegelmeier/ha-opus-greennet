blueprint:
  name: "Opus GreenNet: Absence simulation for lighting"
  description: |-
    **What this does.** While nobody is home, this automation switches the lights you choose on and off at changing times. It makes the home look lived in. It is **not a burglary protection** and gives no guarantee.

    **Set up in three steps** (section "Basic settings"):
    1. Choose how absence is detected: people, or an existing absence switch.
    2. Choose the lights.
    3. Choose the time period in which lights may be switched on.

    That is enough. Everything else is optional. All lights chosen here belong to this one absence simulation. For a second, independent zone, create another automation from this blueprint with other lights.

    **How it behaves**
    - The first light does not come on at once. A random pause of 5 to 20 minutes comes first.
    - A light stays on for 15 to 45 minutes. Then there is a pause of 5 to 20 minutes. Sometimes two lights overlap. The numbers are design values. They are not scientifically proven to look realistic.
    - Lights that are already on when the simulation starts are never touched.
    - Only lights that the simulation switched on itself are switched off again.
    - The simulation ends at once when somebody comes home, when the absence switch goes off, when the time period ends or when the extra release is switched off. Then the lights it switched on are switched off. A pending switch-on is cancelled.
    - If a state is unknown or unavailable, no simulation starts and a running one ends. It starts again by itself when the state is clear again.

    **Good to know**
    - Choose lights that no other automation controls while you are away.
    - If you change or reload the automation, switch it off, or restart Home Assistant during a simulation, it is stopped without switching off. Lights it had switched on can stay on. After a restart those lights count as "already on" and stay untouched.
    - A light that stops following the simulation (for example somebody switches it off or it becomes unavailable) is left alone by the simulation for the rest of that light's turn.
    - The limit for lights on at the same time counts selected entities, not physical bulbs.
    - Needs Home Assistant 2024.10 or newer.
  domain: automation
  source_url: https://github.com/kegelmeier/ha-opus-greennet/blob/main/blueprints/automation/opus_greennet/absence_simulation.yaml
  author: Opus GreenNet Bridge
  homeassistant:
    min_version: 2024.10.0
  input:
    basics:
      name: "Basic settings"
      icon: mdi:cog
      description: "Fill in these three things and it works: how absence is detected, which lights, which time period."
      collapsed: false
      input:
        absence_method:
          name: "How is absence detected?"
          description: "Choose one. Only the field for your choice is used. Leave the other field empty."
          default: persons
          selector:
            select:
              mode: list
              options:
                - label: "People: everyone must be away"
                  value: persons
                - label: "Existing absence switch: On = nobody is home"
                  value: switch
        persons:
          name: "People"
          description: "Only for the choice \"People\". Select ALL people who live here. The simulation only runs while every selected person is away. If someone is missing here, lights may run while that person is home. A person whose state is unknown or unavailable does not count as away."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
        absence_switch:
          name: "Absence switch"
          description: "Only for the choice \"Existing absence switch\". Select a helper or binary sensor that is On when nobody is home. If it is Off, unknown or unavailable, the simulation does not run."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - switch
        lights:
          name: "Lights"
          description: "All lights selected here belong to this absence simulation. Lights from different makers can be mixed. Select at least one light or one switch actuator. Select single lights, not light groups (groups are ignored)."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        light_switches:
          name: "More light switch actuators"
          description: "For lighting that Home Assistant shows as a switch."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: switch
        window_start:
          name: "Start of the allowed period"
          description: "Lights are only switched on inside this period. If start and end are the same, the period is the whole day."
          default: "19:00:00"
          selector:
            time:
        window_end:
          name: "End of the allowed period"
          description: "At this time the simulation ends and switches off what it switched on. A period over midnight works, for example 22:00 to 06:00."
          default: "23:00:00"
          selector:
            time:
    release_section:
      name: "Extra release - optional"
      icon: mdi:beach
      description: "Optional. You can leave this empty."
      collapsed: true
      input:
        release_entities:
          name: "Extra release"
          description: "If you select for example your vacation switch here, the simulation only runs while it is on. Without a selection no extra release is needed. Absence and time period still apply. If several are selected, all must be on."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - binary_sensor
                    - switch
    brightness_section:
      name: "Brightness - optional"
      icon: mdi:brightness-6
      description: "Optional. You can leave this empty."
      collapsed: true
      input:
        set_brightness:
          name: "Set brightness"
          description: "Off: lights are only switched on, and no brightness is sent. On: the brightness below is used. The brightness is only applied to dimmable lights. It affects only the switch-on by the simulation. Earlier stored values of a device are not restored afterwards. Note: with Off, an Opus dimmer switches on at full brightness."
          default: false
          selector:
            boolean:
        brightness_pct:
          name: "Brightness in percent"
          description: "Only used if \"Set brightness\" is on."
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    advanced_section:
      name: "Advanced settings"
      icon: mdi:tune
      description: "Usually you do not need to change anything here."
      collapsed: true
      input:
        max_lights:
          name: "Maximum lights switched on at the same time"
          description: "This simulation switches on at most this many of the selected lights at the same time. Lights that were switched on in another way stay untouched. It is an upper limit, not a target. Fewer lights, or none, may be on. Counted are selected entities, not physical bulbs."
          default: 2
          selector:
            number:
              min: 1
              max: 6
              step: 1
              mode: box

mode: queued
max: 2
max_exceeded: silent

triggers:
  - trigger: state
    id: presence
    entity_id: !input persons
  - trigger: state
    id: absence_switch
    entity_id: !input absence_switch
  - trigger: state
    id: release
    entity_id: !input release_entities
  - trigger: time
    id: window_start
    at: !input window_start
  - trigger: homeassistant
    id: ha_start
    event: start
  - trigger: time_pattern
    id: periodic_check
    minutes: "/5"

variables:
  absence_method: !input absence_method
  persons: !input persons
  absence_switch: !input absence_switch
  lights_in: !input lights
  switches_in: !input light_switches
  window_start: !input window_start
  window_end: !input window_end
  release_entities: !input release_entities
  set_brightness: !input set_brightness
  brightness_pct: !input brightness_pct
  max_lights: !input max_lights
  targets: >-
    {%- set a = lights_in if lights_in is not string else [lights_in] -%}
    {%- set b = switches_in if switches_in is not string else [switches_in] -%}
    {{ (a + b) | unique | list }}

actions:
  - alias: "Calculate the end of the time period and the lights that are already on"
    variables:
      end_ts: >-
        {%- set s = (window_start ~ ':00')[:8] -%}
        {%- set e = (window_end ~ ':00')[:8] -%}
        {%- set n = now().strftime('%H:%M:%S') -%}
        {%- if s == e -%}
          {{ now().timestamp() + 86400 }}
        {%- elif (s < e and s <= n and n < e) or (s > e and (n >= s or n < e)) -%}
          {%- set c = today_at(e) -%}
          {{ (c if c > now() else c + timedelta(days=1)).timestamp() }}
        {%- else -%}
          0
        {%- endif -%}
      excluded: >-
        {{ expand(targets) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
  - alias: "Continue only if the simulation may start now"
    condition: template
    value_template: >-
      {%- set bad = ['home', 'unknown', 'unavailable'] -%}
      {%- set n_p = persons | count -%}
      {%- set n_a = absence_switch | count -%}
      {%- set n_r = release_entities | count -%}
      {%- if absence_method == 'persons' -%}
        {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
      {%- else -%}
        {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
      {%- endif -%}
      {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
      {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
      {{ not stop }}
  - alias: "Run the simulation until a stop condition applies"
    repeat:
      while:
        - condition: template
          value_template: >-
            {%- set bad = ['home', 'unknown', 'unavailable'] -%}
            {%- set n_p = persons | count -%}
            {%- set n_a = absence_switch | count -%}
            {%- set n_r = release_entities | count -%}
            {%- if absence_method == 'persons' -%}
              {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
            {%- else -%}
              {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
            {%- endif -%}
            {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
            {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
            {{ not stop }}
      sequence:
        - alias: "Choose a random pause"
          variables:
            pause_s: >-
              {{ [ [ (range(300, 1201, 30) | random), ((end_ts - now().timestamp()) | int) ] | min, 0 ] | max }}
        - alias: "Pause (ends early when the simulation must stop)"
          wait_template: >-
            {%- set bad = ['home', 'unknown', 'unavailable'] -%}
            {%- set n_p = persons | count -%}
            {%- set n_a = absence_switch | count -%}
            {%- set n_r = release_entities | count -%}
            {%- if absence_method == 'persons' -%}
              {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
            {%- else -%}
              {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
            {%- endif -%}
            {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
            {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
            {{ stop }}
          timeout: "{{ pause_s }}"
          continue_on_timeout: true
        - alias: "Stop if the simulation must end"
          condition: template
          value_template: >-
            {%- set bad = ['home', 'unknown', 'unavailable'] -%}
            {%- set n_p = persons | count -%}
            {%- set n_a = absence_switch | count -%}
            {%- set n_r = release_entities | count -%}
            {%- if absence_method == 'persons' -%}
              {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
            {%- else -%}
              {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
            {%- endif -%}
            {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
            {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
            {{ not stop }}
        - alias: "Plan the next round of lights"
          variables:
            plan: >-
              {%- set pool = namespace(rows=[]) -%}
              {%- for e in targets -%}
                {%- if states(e) == 'off' and e not in excluded and state_attr(e, 'entity_id') is none -%}
                  {%- set pool.rows = pool.rows + [{'e': e, 'ts': as_timestamp(states[e].last_changed)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set cands = pool.rows | sort(attribute='ts', reverse=true) | map(attribute='e') | list -%}
              {%- set m = [max_lights | int(2), cands | count] | min -%}
              {%- if cands | count >= 3 -%}
                {%- set m = [m, cands | count - 1] | min -%}
              {%- endif -%}
              {%- set n = 0 -%}
              {%- if m >= 1 -%}
                {%- set n = 1 if (m == 1 or (range(0, 100) | random) < 45) else (range(2, m + 1) | random) -%}
              {%- endif -%}
              {%- set first_pool = cands[1:] if cands | count >= 2 else cands -%}
              {%- set out = namespace(rows=[], left=cands, d1=900) -%}
              {%- set base = now().timestamp() -%}
              {%- for k in range(n) -%}
                {%- set cand = first_pool if k == 0 else out.left -%}
                {%- if cand | count > 0 -%}
                  {%- set pick = cand | random -%}
                  {%- set dur = range(900, 2701, 60) | random -%}
                  {%- if k == 0 -%}
                    {%- set out.d1 = dur -%}
                  {%- endif -%}
                  {%- set t_on = base + (0 if k == 0 else (range(180, out.d1 - 119, 60) | random)) -%}
                  {%- set t_off = [t_on + dur, end_ts] | min -%}
                  {%- if t_off - t_on >= 300 -%}
                    {%- set modes = state_attr(pick, 'supported_color_modes') or [] -%}
                    {%- set dim = 1 if (set_brightness and pick.startswith('light.') and (modes | reject('in', ['onoff', 'unknown']) | list | count) > 0) else 0 -%}
                    {%- set out.rows = out.rows + [{'entity': pick, 't_on': t_on | int, 't_off': t_off | int, 'dim': dim}] -%}
                  {%- endif -%}
                  {%- set out.left = out.left | reject('eq', pick) | list -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out.rows }}
        - variables:
            slot_0: "{{ plan[0:1] }}"
            slot_1: "{{ plan[1:2] }}"
            slot_2: "{{ plan[2:3] }}"
            slot_3: "{{ plan[3:4] }}"
            slot_4: "{{ plan[4:5] }}"
            slot_5: "{{ plan[5:6] }}"
        - alias: "Run the planned lights side by side"
          parallel:
            - repeat:
                for_each: "{{ slot_0 }}"
                sequence: &slot
                  - alias: "Wait for the planned switch-on time (ends early on stop)"
                    wait_template: >-
                      {%- set bad = ['home', 'unknown', 'unavailable'] -%}
                      {%- set n_p = persons | count -%}
                      {%- set n_a = absence_switch | count -%}
                      {%- set n_r = release_entities | count -%}
                      {%- if absence_method == 'persons' -%}
                        {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
                      {%- else -%}
                        {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
                      {%- endif -%}
                      {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
                      {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
                      {{ stop }}
                    timeout: >-
                      {{ [ (repeat.item.t_on - now().timestamp()) | int, 0 ] | max }}
                    continue_on_timeout: true
                  - alias: "Switch on only if still allowed and the light is off"
                    if:
                      - condition: template
                        value_template: >-
                          {%- set bad = ['home', 'unknown', 'unavailable'] -%}
                          {%- set n_p = persons | count -%}
                          {%- set n_a = absence_switch | count -%}
                          {%- set n_r = release_entities | count -%}
                          {%- if absence_method == 'persons' -%}
                            {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
                          {%- else -%}
                            {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
                          {%- endif -%}
                          {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
                          {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
                          {{ not stop and is_state(repeat.item.entity, 'off') and now().timestamp() >= repeat.item.t_on - 3 }}
                    then:
                      - alias: "Switch the light on"
                        choose:
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{ repeat.item.dim == 1 }}
                            sequence:
                              - action: light.turn_on
                                target:
                                  entity_id: >-
                                    {{ repeat.item.entity }}
                                data:
                                  brightness_pct: >-
                                    {{ brightness_pct | int(50) }}
                        default:
                          - action: homeassistant.turn_on
                            target:
                              entity_id: >-
                                {{ repeat.item.entity }}
                      - alias: "Wait for the light to report on (30 seconds at most)"
                        wait_template: >-
                          {{ is_state(repeat.item.entity, 'on') }}
                        timeout: 30
                        continue_on_timeout: true
                      - alias: "Keep the light on until the end time or until it must stop"
                        if:
                          - condition: template
                            value_template: >-
                              {{ is_state(repeat.item.entity, 'on') }}
                        then:
                          - wait_template: >-
                              {%- set bad = ['home', 'unknown', 'unavailable'] -%}
                              {%- set n_p = persons | count -%}
                              {%- set n_a = absence_switch | count -%}
                              {%- set n_r = release_entities | count -%}
                              {%- if absence_method == 'persons' -%}
                                {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
                              {%- else -%}
                                {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
                              {%- endif -%}
                              {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
                              {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
                              {{ stop or not is_state(repeat.item.entity, 'on') }}
                            timeout: >-
                              {{ [ (repeat.item.t_off - now().timestamp()) | int, 0 ] | max }}
                            continue_on_timeout: true
                        else:
                          - wait_template: >-
                              {%- set bad = ['home', 'unknown', 'unavailable'] -%}
                              {%- set n_p = persons | count -%}
                              {%- set n_a = absence_switch | count -%}
                              {%- set n_r = release_entities | count -%}
                              {%- if absence_method == 'persons' -%}
                                {%- set away = n_p > 0 and (expand(persons) | rejectattr('state', 'in', bad) | list | count) == n_p -%}
                              {%- else -%}
                                {%- set away = n_a > 0 and (expand(absence_switch) | selectattr('state', 'eq', 'on') | list | count) == n_a -%}
                              {%- endif -%}
                              {%- set released = n_r == 0 or (expand(release_entities) | selectattr('state', 'eq', 'on') | list | count) == n_r -%}
                              {%- set stop = not (away and released and now().timestamp() < end_ts) -%}
                              {{ stop }}
                            timeout: >-
                              {{ [ (repeat.item.t_off - now().timestamp()) | int, 0 ] | max }}
                            continue_on_timeout: true
                      - alias: "Switch off only a light that the simulation switched on itself"
                        if:
                          - condition: template
                            value_template: >-
                              {{ is_state(repeat.item.entity, 'on') and as_timestamp(states[repeat.item.entity].last_changed) >= repeat.item.t_on - 5 and as_timestamp(states[repeat.item.entity].last_changed) <= repeat.item.t_on + 180 }}
                        then:
                          - action: homeassistant.turn_off
                            target:
                              entity_id: >-
                                {{ repeat.item.entity }}
            - repeat:
                for_each: "{{ slot_1 }}"
                sequence: *slot
            - repeat:
                for_each: "{{ slot_2 }}"
                sequence: *slot
            - repeat:
                for_each: "{{ slot_3 }}"
                sequence: *slot
            - repeat:
                for_each: "{{ slot_4 }}"
                sequence: *slot
            - repeat:
                for_each: "{{ slot_5 }}"
                sequence: *slot
