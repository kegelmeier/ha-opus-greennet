blueprint:
  name: "Opus GreenNet: water leak, warn"
  description: |-
    **What this does.** A water leak sensor reports water. Then this
    automation warns you, for example with a message on your phone. The
    warning can be repeated until the sensor reports dry again.

    **Sensors.** Opus sensors and water leak sensors of other makers both work.
    You pick the sensors yourself. Only sensors of the type "moisture" are
    shown. If yours is missing in the list, check the device class of the
    sensor (Settings, Devices & services, Entities, the gear, *Show as*).

    **Good to know**
    - A sensor reports only when its state changes.
    - "Unavailable" (for example during a gateway outage) does not count as
      dry. A repeated warning goes on until the sensor reports dry.
    - This does not close a valve. It only warns.
    - Test it: wet the sensor or use its test button, if it has one.
  domain: automation
  author: Opus GreenNet Bridge
  source_url: https://github.com/kegelmeier/ha-opus-greennet/blob/main/blueprints/automation/opus_greennet/water_leak_warning.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    leak_sensors:
      name: Water leak sensors (any make)
      description: >-
        Pick the sensors that should start the warning. Opus sensors and
        sensors of other makers both work. Only sensors of the type
        "moisture" are shown.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class: moisture
    warning:
      name: Warning (for example a message on your phone)
      description: |-
        Here you say how you want to be warned. The first step is already
        there: it shows a message in Home Assistant.

        **How to get a message on your phone**
        1. Install the Home Assistant app on your phone. Sign in once.
        2. Click **Add action** below.
        3. Type *notification* in the search. Choose **Notifications: Send a
           notification via mobile_app_...** with the name of your phone.
        4. Write a **Message**, for example:
           `Water leak! {{ trigger.to_state.name }}`
           (`trigger.to_state.name` is replaced by the name of the sensor).
        5. Click **Save** at the end.

        You can add more steps: a siren, a spoken message, a light, and so on.
        Tip: For a loud message even if the phone is on silent, see
        "Critical notifications" in the Home Assistant Companion App
        documentation.
      default:
        - action: persistent_notification.create
          data:
            title: Water leak
            message: "{{ trigger.to_state.name }} reports a water leak."
      selector:
        action:
    repeat_minutes:
      name: Repeat the warning every (minutes)
      description: >-
        The warning is repeated until the sensor reports dry again. 0 means:
        warn only once.
      default: 0
      selector:
        number:
          min: 0
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box

mode: parallel
max: 10
max_exceeded: silent

variables:
  repeat_minutes: !input repeat_minutes

triggers:
  - trigger: state
    entity_id: !input leak_sensors
    to: "on"

actions:
  - repeat:
      sequence:
        - alias: Warn
          sequence: !input warning
        - if:
            - condition: template
              value_template: "{{ repeat_minutes | int(0) <= 0 }}"
          then:
            - stop: Warned once
        - delay:
            minutes: "{{ repeat_minutes | int(0) }}"
      until:
        - alias: The sensor reports dry again
          condition: template
          value_template: "{{ is_state(trigger.entity_id, 'off') }}"
