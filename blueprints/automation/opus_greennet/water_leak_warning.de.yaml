blueprint:
  name: "Opus GreenNet: Wasseralarm, warnen"
  description: >-
    Führt eine Warnung aus, wenn ein Wassermelder Wasser meldet. Auf Wunsch
    wird die Warnung wiederholt, bis der Melder wieder „trocken“ meldet.

    Der Wassermelder meldet nur, wenn sich sein Zustand ändert. Bei einem
    Ausfall des Gateways zeigt er „nicht verfügbar“. Das zählt nicht als
    trocken: Eine wiederholte Warnung läuft weiter, bis der Melder „trocken“
    meldet.
  domain: automation
  author: Opus GreenNet Bridge
  source_url: https://github.com/kegelmeier/ha-opus-greennet/blob/main/blueprints/automation/opus_greennet/water_leak_warning.de.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    leak_sensors:
      name: Wassermelder
      selector:
        entity:
          multiple: true
          filter:
            - integration: opus_greennet
              domain: binary_sensor
              device_class: moisture
    warning:
      name: Warnung
      description: >-
        Die Aktionen, die warnen, zum Beispiel eine Benachrichtigung auf Ihr
        Handy, eine Sirene oder Lichter. Die Variable trigger.to_state enthält
        den Wassermelder. Der erste Schritt zeigt eine Meldung in Home
        Assistant. Für eine Nachricht aufs Handy: Aktion hinzufügen,
        „Benachrichtigung“ suchen, „Benachrichtigung senden über mobile_app_…“
        mit Ihrem Handy wählen und eine Nachricht schreiben.
      default:
        - action: persistent_notification.create
          data:
            title: Wasseralarm
            message: "{{ trigger.to_state.name }} meldet Wasser."
      selector:
        action:
    repeat_minutes:
      name: Wiederholen alle (Minuten)
      description: Wiederholt die Warnung, solange der Melder Wasser meldet. 0 warnt nur einmal.
      default: 0
      selector:
        number:
          min: 0
          max: 240
          step: 1
          unit_of_measurement: min
          mode: box

mode: parallel
max: 10
max_exceeded: silent

variables:
  repeat_minutes: !input repeat_minutes

triggers:
  - trigger: state
    entity_id: !input leak_sensors
    to: "on"

actions:
  - repeat:
      sequence:
        - alias: Warn
          sequence: !input warning
        - if:
            - condition: template
              value_template: "{{ repeat_minutes | int(0) <= 0 }}"
          then:
            - stop: Warned once
        - delay:
            minutes: "{{ repeat_minutes | int(0) }}"
      until:
        - alias: The sensor reports dry again
          condition: template
          value_template: "{{ is_state(trigger.entity_id, 'off') }}"
