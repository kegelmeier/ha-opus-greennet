blueprint:
  name: "Opus GreenNet: Bewegungs- und Präsenzlicht mit optionalem Nachtlicht"
  description: |-
    **Was das macht.** Das Licht geht an, wenn ein Bewegungs- oder Präsenzmelder jemanden meldet. Es geht wieder aus, wenn der letzte Melder die von Ihnen gewählte Zeit lang ruhig war.

    **Einrichten in drei Schritten** (Abschnitt 1 unten). Mehr ist nicht nötig:
    1. Melder wählen.
    2. Lichter wählen.
    3. Wählen, wie lange das Licht anbleibt.

    **Eine Automation pro Raum.** Eine Automation kann viele Melder und viele Lichter nutzen. Für den nächsten Raum nutzen Sie das Blueprint noch einmal.

    **Wie lange bleibt das Licht an?** Die Nachlaufzeit beginnt, wenn ALLE gewählten Melder ruhig sind. Viele Melder haben eine eigene Haltezeit. Die echte Zeit ist die Haltezeit des Melders plus die Zeit, die Sie hier einstellen.

    **Optionale Teile** (Abschnitte 2 bis 4, am Anfang eingeklappt): eine feste Helligkeit, „nur bei Dunkelheit“ und ein Nachtlicht. Jeder Teil hat seine eigene Lichterwahl: Wählen Sie die Lichter in jedem Teil, den Sie einschalten, noch einmal. Lassen Sie einen Teil in Ruhe, wenn Sie ihn nicht brauchen. Seine Felder zählen nur, wenn Sie den Teil einschalten.

    **Gut zu wissen**
    - Die Automation schaltet nur Lichter aus, die sie selbst eingeschaltet hat. Ein Licht, das schon an war, bleibt, wie es ist.
    - Schalten Sie ein Licht von Hand aus, während jemand im Raum ist, wird es nicht wieder eingeschaltet. Erst wenn der Raum die Nachlaufzeit lang leer war, startet das Licht wieder normal.
    - Startet Home Assistant neu oder wird diese Automation gespeichert oder neu geladen, vergisst sie, welche Lichter sie eingeschaltet hat. Diese Lichter bleiben dann an, bis Sie sie ausschalten.
    - Die Melder und die Lichter müssen schon in Home Assistant vorhanden sein. Melder und Lichter verschiedener Hersteller können gemischt werden.
    - Unterstützt werden nur Lichter. Wird Ihre Lampe in Home Assistant als Schalter angezeigt, legen Sie zuerst ein Licht daraus an (Einstellungen > Geräte & Dienste > Helfer > Schalter als X > Licht).
  domain: automation
  author: Opus GreenNet Bridge
  source_url: https://github.com/kegelmeier/ha-opus-greennet/blob/main/blueprints/automation/opus_greennet/motion_presence_light.de.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    basic_section:
      name: "1. Grundeinstellungen"
      icon: mdi:motion-sensor
      description: Füllen Sie diese drei Dinge aus. Dann funktioniert das Licht.
      input:
        motion_sensors:
          name: Bewegungs- oder Präsenzmelder
          description: >-
            Welche Melder sollen das Licht schalten? Sie können mehrere wählen.
            Das Licht bleibt an, solange mindestens einer von ihnen Bewegung
            oder Anwesenheit meldet.
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        lights:
          name: Lichter
          description: >-
            Die Lichter, die eingeschaltet werden sollen. Sie können mehrere
            wählen.
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        off_delay:
          name: Nachlaufzeit nach der letzten Bewegung
          description: >-
            Wie lange das Licht anbleibt, nachdem alle Melder ruhig sind. 0
            bedeutet: ausschalten, sobald alle Melder ruhig sind. Stunden,
            Minuten und Sekunden.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
    brightness_section:
      name: "2. Helligkeit einstellen (optional)"
      icon: mdi:brightness-6
      description: >-
        Nur ausfüllen, wenn Sie eine feste Helligkeit wollen. Ohne sie werden
        die Lichter nur eingeschaltet.
      collapsed: true
      input:
        set_brightness:
          name: Helligkeit vorgeben
          description: >-
            Aus: Die Lichter werden nur eingeschaltet, es wird keine Helligkeit
            vorgegeben. Ein: Die unten gewählten Lichter bekommen die Helligkeit
            von unten.
          default: false
          selector:
            boolean:
        brightness_lights:
          name: Lichter mit dieser Helligkeit
          description: >-
            Nur ausfüllen, wenn „Helligkeit vorgeben“ eingeschaltet ist. Wählen
            Sie die Lichter noch einmal, die die Helligkeit bekommen sollen.
            Lichter, die sich nicht dimmen lassen, werden nur eingeschaltet.
            Lichter aus Abschnitt 1, die Sie hier nicht wählen, werden nur
            eingeschaltet.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        brightness:
          name: Helligkeit in Prozent
          description: >-
            Nur ausfüllen, wenn „Helligkeit vorgeben“ eingeschaltet ist. Das ist
            die Helligkeit der Lampe, nicht die des Raums.
          default: 80
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    darkness_section:
      name: "3. Nur bei Dunkelheit (optional)"
      icon: mdi:weather-night
      description: >-
        Nur ausfüllen, wenn einige Lichter nur im Dunkeln angehen sollen. Sie
        brauchen einen Sensor, der die Helligkeit des Raums in Lux misst.
      collapsed: true
      input:
        only_when_dark:
          name: Nur bei Dunkelheit einschalten
          description: >-
            Aus: Die Lichter gehen an, sobald jemand da ist. Ein: Die unten
            gewählten Lichter gehen nur an, wenn die Helligkeitsprüfung von
            unten erfüllt ist.
          default: false
          selector:
            boolean:
        dark_lights:
          name: Lichter, die nur im Dunkeln angehen
          description: >-
            Nur ausfüllen, wenn „Nur bei Dunkelheit einschalten“ eingeschaltet
            ist. Wählen Sie die Lichter noch einmal, die nur im Dunkeln angehen
            sollen. Lichter aus Abschnitt 1, die Sie hier nicht wählen, gehen
            wie gewohnt an.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        lux_sensor:
          name: Helligkeitssensor
          description: >-
            Nur ausfüllen, wenn „Nur bei Dunkelheit einschalten“ eingeschaltet
            ist. Ein Sensor, der die Helligkeit des Raums in Lux misst, nicht
            die Helligkeit der Lampe.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance
        lux_threshold:
          name: Einschalten unter dieser Helligkeit (Lux)
          description: >-
            Unter diesem Wert dürfen die Lichter automatisch angehen. Genau
            dieser Wert liegt nicht darunter: Die Lichter bleiben aus. Die
            Prüfung wird einmal gemacht, wenn jemand hereinkommt. Ein Licht, das
            schon an ist, wird nicht ausgeschaltet, wenn der Raum heller wird.
            Ein defekter oder fehlender Messwert zählt als dunkel, damit das
            Licht trotzdem funktioniert.
          default: 50
          selector:
            number:
              min: 1
              max: 10000
              step: 1
              unit_of_measurement: lx
              mode: box
    night_section:
      name: "4. Nachtlicht (optional)"
      icon: mdi:lightbulb-night
      description: >-
        Nur ausfüllen, wenn das Licht nachts anders arbeiten soll. Nachts
        werden nur die Nachtlichter von unten eingeschaltet, statt der Lichter
        aus Abschnitt 1. Die Wahl wird getroffen, wenn das Licht angeht, und
        bleibt, bis der Raum wieder leer ist.
      collapsed: true
      input:
        night_light_enabled:
          name: Nachtlicht verwenden
          description: >-
            Aus: Nachts ändert sich nichts. Ein: Nachts werden die Nachtlichter
            von unten genutzt.
          default: false
          selector:
            boolean:
        night_start:
          name: Die Nacht beginnt um
          description: >-
            Nur ausfüllen, wenn Sie ein Nachtlicht nutzen. Die Nacht kann über
            Mitternacht gehen. Sind Beginn und Ende gleich, gibt es keine Nacht.
          default: "22:00:00"
          selector:
            time:
        night_end:
          name: Die Nacht endet um
          description: Nur ausfüllen, wenn Sie ein Nachtlicht nutzen.
          default: "06:00:00"
          selector:
            time:
        night_lights:
          name: Nachtlichter
          description: >-
            Nur ausfüllen, wenn Sie ein Nachtlicht nutzen. Wählen Sie die
            Lichter noch einmal, die nachts angehen sollen. Das können dieselben
            Lichter wie in Abschnitt 1 sein oder andere.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        night_set_brightness:
          name: Nachthelligkeit vorgeben
          description: >-
            Aus: Die Nachtlichter werden nur eingeschaltet, es wird keine
            Helligkeit vorgegeben. Ein: Dimmbare Nachtlichter bekommen die
            Nachthelligkeit.
          default: false
          selector:
            boolean:
        night_brightness:
          name: Nachthelligkeit in Prozent
          description: >-
            Nur ausfüllen, wenn „Nachthelligkeit vorgeben“ eingeschaltet ist.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        night_off_delay:
          name: Nachlaufzeit nachts nach der letzten Bewegung
          description: >-
            Nur ausfüllen, wenn Sie ein Nachtlicht nutzen. Wird nachts statt der
            Zeit aus Abschnitt 1 genutzt.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration:

# Ein Ablauf pro Raum ist das Gedächtnis der Automation. Er weiß, welche
# Lichter er eingeschaltet hat, und kann nur diese ausschalten. Ein zweiter
# Start, während ein Ablauf läuft, wird ignoriert. Ein Neustart würde dieses
# Gedächtnis löschen, darum wird „single“ verwendet.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    id: sensor_active
    entity_id: !input motion_sensors
    to: "on"
  - trigger: homeassistant
    id: ha_started
    event: start

variables:
  sensors: !input motion_sensors
  lights: !input lights
  delay_day: !input off_delay
  use_brightness: !input set_brightness
  brightness_lights: !input brightness_lights
  brightness_day: !input brightness
  lux_enabled: !input only_when_dark
  dark_lights: !input dark_lights
  lux_entity: !input lux_sensor
  lux_limit: !input lux_threshold
  night_enabled: !input night_light_enabled
  night_start: !input night_start
  night_end: !input night_end
  night_lights: !input night_lights
  night_use_brightness: !input night_set_brightness
  night_brightness_value: !input night_brightness
  delay_night: !input night_off_delay

actions:
  - alias: Mit Fehler stoppen, wenn die Einrichtung unvollständig ist
    if:
      - condition: template
        value_template: >-
          {{ (lights | count) == 0
             or (use_brightness and (brightness_lights | count) == 0)
             or (lux_enabled and (lux_entity == '' or (dark_lights | count) == 0))
             or (night_enabled and (night_lights | count) == 0) }}
    then:
      - stop: >-
          Einrichtung unvollständig: Wählen Sie mindestens ein Licht. Jeder Teil,
          den Sie einschalten, braucht eigene Lichter: Lichter mit Helligkeit,
          Lichter, die nur im Dunkeln angehen (und einen Helligkeitssensor),
          oder Nachtlichter.
        error: true

  - alias: Nichts tun, wenn kein Melder Aktivität meldet
    condition: template
    value_template: >-
      {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}

  - alias: Tag oder Nacht und die Lichter einmal für diesen Ablauf wählen
    variables:
      night_active: >-
        {% set now_hm = now().strftime('%H:%M') %}
        {% set s = night_start[:5] %}
        {% set e = night_end[:5] %}
        {% if not night_enabled %}{% set r = false %}
        {% elif s == e %}{% set r = false %}
        {% elif s < e %}{% set r = s <= now_hm < e %}
        {% else %}{% set r = now_hm >= s or now_hm < e %}
        {% endif %}
        {{ r }}
      lux: "{{ states(lux_entity) if (lux_enabled and lux_entity != '') else '' }}"
      is_dark: >-
        {{ (not lux_enabled) or (not is_number(lux)) or ((lux | float) < (lux_limit | float)) }}
      blocked_lights: "{{ [] if is_dark else dark_lights }}"
      run_lights: >-
        {{ (night_lights if night_active else lights) | reject('in', blocked_lights) | list }}
      run_set_brightness: "{{ night_use_brightness if night_active else use_brightness }}"
      run_brightness: "{{ night_brightness_value if night_active else brightness_day }}"
      dim_pool: "{{ night_lights if night_active else brightness_lights }}"
      run_delay: >-
        {{ timedelta(**(delay_night if night_active else delay_day)).total_seconds() }}
      owned_lights: >-
        {{ run_lights | reject('is_state', 'on') | reject('is_state', 'unavailable') | list }}
      dimmable_lights: >-
        {% set ns = namespace(found=[]) %}
        {% for entity in owned_lights if entity in dim_pool %}
          {% set modes = state_attr(entity, 'supported_color_modes') or [] %}
          {% if (modes | reject('in', ['onoff', 'unknown']) | list | count) > 0 %}
            {% set ns.found = ns.found + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      dim_lights: "{{ dimmable_lights if run_set_brightness else [] }}"
      plain_lights: "{{ owned_lights | reject('in', dim_lights) | list }}"

  - alias: Dimmbare Lichter mit der gewählten Helligkeit einschalten
    if:
      - condition: template
        value_template: "{{ dim_lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ dim_lights }}"
        data:
          brightness_pct: "{{ run_brightness | int }}"
        continue_on_error: true

  - alias: Die übrigen Lichter einschalten
    if:
      - condition: template
        value_template: "{{ plain_lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: "{{ plain_lights }}"
        continue_on_error: true

  # Der Ablauf bleibt am Leben, bis der Raum leer und die Nachlaufzeit vorbei
  # ist. Das verhindert, dass ein von Hand ausgeschaltetes Licht im selben
  # Besuch wieder eingeschaltet wird. Jede Runde wartet auf ein Ereignis.
  # „count“ wird verwendet, weil Home Assistant „while“-Schleifen nach 10000
  # Runden abbricht; das Ende des Ablaufs ist die „stop“-Aktion unten.
  - alias: Licht anlassen, bis alle gegangen sind und die Nachlaufzeit vorbei ist
    repeat:
      count: 1000000
      sequence:
        - alias: Warten, bis alle Melder ruhig sind
          wait_template: >-
            {{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
        - alias: Nachlaufzeit (neue Aktivität bricht sie ab)
          wait_for_trigger:
            - trigger: state
              entity_id: !input motion_sensors
              to: "on"
          timeout: "{{ [run_delay | float, 0.1] | max }}"
          continue_on_timeout: true
        - alias: "Zeit abgelaufen und alle Melder weiter ruhig: ausschalten"
          if:
            - condition: template
              value_template: >-
                {{ wait.trigger is none
                   and expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          then:
            - variables:
                off_lights: >-
                  {{ owned_lights | select('is_state', ['on', 'unknown']) | list }}
            - if:
                - condition: template
                  value_template: "{{ off_lights | count > 0 }}"
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ off_lights }}"
                  continue_on_error: true
            - stop: Raum leer, die Lichter dieses Ablaufs sind ausgeschaltet.
